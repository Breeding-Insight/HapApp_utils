[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hapapp-utils"
dynamic = ["version"]
description = "Build and maintain microhaplotype databases from targeted genotyping reports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Breeding Insight" }]
dependencies = [
  "biopython",
  "cutadapt",
  "openpyxl",
  "pandas",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/Breeding-Insight/HapApp_utils"
Documentation = "https://hapapp.readthedocs.io"
Issues = "https://github.com/Breeding-Insight/HapApp_utils/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hapapp-utils = "hapapp_utils.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hapapp_utils.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
